name = "sovereign-sigma-ingest"
main = "src/IngestWorker.ts"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "TRADING_ENGINE"
class_name = "TradingEngine"
script_name = "sovereign-sigma-core"

[[d1_databases]]
binding = "TRADING_DB"
database_name = "TRADING_DB"
database_id = "64fc2511-fd03-4c76-afd8-2fa671049c10"
preview_database_id = "4c6c2cf3-e6e3-410a-afe1-b4e611a0e34f"

[[kv_namespaces]]
binding = "CONFIG_STORE"
id = "49fe0b24ba1d40209e5d4fa849144dd2"
preview_id = "01652227040f4c59ab9256d0e251ba23"

[[kv_namespaces]]
binding = "RISK_VAULT"
id = "275a00fff7e94e4b9e30e71b24ffb9c5"
preview_id = "3d69fe3608404e049791ce81142dab8e"

[triggers]
crons = ["*/1 * * * *"]

[placement]
mode = "smart"

[vars]
KAIKO_STREAM_URL = "wss://replace-with-kaiko-websocket-endpoint"
KAIKO_SNAPSHOT_URL = "https://replace-with-kaiko-rest-snapshot-endpoint"
KAIKO_SNAPSHOT_EXCHANGE = "cbse"
KAIKO_SNAPSHOT_INSTRUMENT = "btc-usd"
KAIKO_AUTH_HEADER = "X-Api-Key"
KAIKO_SNAPSHOT_AUTH_HEADER = "X-Api-Key"
KAIKO_HEARTBEAT_INTERVAL_MS = "15000"
KAIKO_STALE_AFTER_MS = "5000"
KAIKO_WATCHDOG_TIMEOUT_MS = "5000"
KAIKO_MAX_BACKOFF_MS = "30000"
MARKET_STREAMS = "[{\"id\":\"kaiko-cbse-btc-usd\",\"source\":\"KAIKO\",\"source_exchange\":\"cbse\",\"streamUrl\":\"wss://replace-with-kaiko-websocket-endpoint\",\"snapshotUrl\":\"https://replace-with-kaiko-rest-snapshot-endpoint\",\"subscription\":{\"instrumentCriteria\":{\"exchange\":\"cbse\",\"instrumentClass\":\"spot\",\"code\":\"btc-usd\"},\"commodities\":[\"SMUC_TRADE\",\"SMUC_TOP_OF_BOOK\"]},\"authHeader\":\"X-Api-Key\",\"apiKeyEnv\":\"KAIKO_API_KEY\",\"weight\":0.65,\"instrumentCode\":\"btc-usd\",\"exchangeCode\":\"cbse\"},{\"id\":\"binance-btc-usdt\",\"source\":\"BINANCE\",\"source_exchange\":\"binance\",\"streamUrl\":\"wss://stream.binance.com:9443/ws/btcusdt@depth@100ms\",\"weight\":1.0,\"instrumentCode\":\"btc-usdt\",\"exchangeCode\":\"binance\"}]"
EXCHANGE_WEIGHTS = "{\"binance\":1.0,\"cbse\":0.65,\"coinbase\":0.65}"
CLOCK_SYNC_ALPHA = "0.10"
CLOCK_SYNC_MAX_OFFSET_MS = "10000"
NOTIFIER_DEBOUNCE_MS = "60000"
NEWS_FEEDS = "[]"
KAIKO_STREAM_SUBSCRIPTION = "{\"instrumentCriteria\":{\"exchange\":\"cbse\",\"instrumentClass\":\"spot\",\"code\":\"btc-usd\"},\"commodities\":[\"SMUC_TRADE\",\"SMUC_TOP_OF_BOOK\"]}"

# Secrets are intentionally excluded from source control/config values.
# Provision alerting and stream credentials with:
#   wrangler secret put KAIKO_API_KEY -c wrangler.ingest.toml
#   wrangler secret put INGESTOR_CONTROL_TOKEN -c wrangler.ingest.toml
#   wrangler secret put DISCORD_WEBHOOK_URL -c wrangler.ingest.toml
#   wrangler secret put TELEGRAM_BOT_TOKEN -c wrangler.ingest.toml
#   wrangler secret put TELEGRAM_CHAT_ID -c wrangler.ingest.toml
