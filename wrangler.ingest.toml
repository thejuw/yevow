name = "sovereign-sigma-ingest"
main = "src/IngestWorker.ts"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "TRADING_ENGINE"
class_name = "TradingEngine"
script_name = "sovereign-sigma-core"

[[durable_objects.bindings]]
name = "INGEST_COORDINATOR"
class_name = "IngestCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IngestCoordinator"]

[[d1_databases]]
binding = "TRADING_DB"
database_name = "TRADING_DB"
database_id = "64fc2511-fd03-4c76-afd8-2fa671049c10"
preview_database_id = "4c6c2cf3-e6e3-410a-afe1-b4e611a0e34f"

[[kv_namespaces]]
binding = "CONFIG_STORE"
id = "49fe0b24ba1d40209e5d4fa849144dd2"
preview_id = "01652227040f4c59ab9256d0e251ba23"

[[kv_namespaces]]
binding = "RISK_VAULT"
id = "275a00fff7e94e4b9e30e71b24ffb9c5"
preview_id = "3d69fe3608404e049791ce81142dab8e"

[triggers]
crons = ["*/1 * * * *"]

[placement]
region = "aws:ap-northeast-1"

[vars]
ENGINE_OBJECT_NAME = "sovereign-sigma:singleton:trading-engine:v3:apac-tokyo"
ENGINE_LOCATION_HINT = "apac"
PLACEMENT_TARGET_COLO = "NRT"
INGEST_COORDINATOR_OBJECT_NAME = "sovereign-sigma:singleton:ingest-coordinator:v3:apac-tokyo"
INGEST_COORDINATOR_LOCATION_HINT = "apac"
INGEST_TRANSPORT = "grpc"
DWELLIR_GRPC_ENDPOINT = "https://api-hyperliquid-mainnet-grpc.n.dwellir.com"
DWELLIR_GRPC_STREAMS = "FILLS"
DWELLIR_GRPC_START_LOOKBACK_MS = "1000"
DWELLIR_GRPC_FORWARD_MAX_AGE_MS = "5000"
DWELLIR_GRPC_FATAL_DROP_MS = "30000"
DWELLIR_GRPC_FILLS_WATCHDOG_TIMEOUT_MS = "60000"
DWELLIR_GRPC_FATAL_ON_FILLS_ONLY = "false"
DWELLIR_MAX_PAYLOAD_BYTES = "160000000"
DWELLIR_MAX_LATENCY_MS = "2500"
DWELLIR_SUBSCRIPTION_TIER = "ENTERPRISE"
DWELLIR_ORDERBOOK_DEPTH = "100"
DWELLIR_ORDERBOOK_TRANSPORT = "websocket"
DWELLIR_ENABLE_L4_BOOK = "false"
RPC_GRPC_ENDPOINT = "https://api-hyperliquid-mainnet-grpc.n.dwellir.com"
RPC_GRPC_SERVICE = "hyperliquid_l1_gateway.v2.HyperliquidL1Gateway"
RPC_GRPC_STREAM_METHOD = "StreamOrderbookSnapshots"
RPC_GRPC_SUBSCRIBE_TYPE = "hyperliquid_l1_gateway.v2.Position"
RPC_GRPC_UPDATE_TYPE = "hyperliquid_l1_gateway.v2.OrderBookSnapshot"
HL_HEARTBEAT_INTERVAL_MS = "15000"
HL_WATCHDOG_TIMEOUT_MS = "5000"
HL_GRPC_BACKOFF_BASE_MS = "50"
HL_MAX_BACKOFF_MS = "30000"
HL_STALE_AFTER_MS = "150"
HL_BOOK_TIMESTAMP_MAX_DRIFT_MS = "100"
HL_SEQUENCE_GAP_MS = "5000"
HL_LIQUIDATION_WALLETS = "[]"
HL_ASSETS = "BTC,ETH,SOL"
HAWKES_BASELINE_MU = "0.10"
HAWKES_JUMP_BETA = "0.90"
HAWKES_DECAY_ALPHA = "2.20"
HAWKES_THRESHOLD_QUANTILE = "0.95"
HAWKES_SIGNAL_COOLDOWN_MS = "60000"
MARKET_STREAMS = "[{\"id\":\"dwellir-hyperliquid-grpc-fills\",\"source\":\"HYPERLIQUID\",\"source_exchange\":\"hyperliquid\",\"transport\":\"grpc\",\"streamUrl\":\"https://api-hyperliquid-mainnet-grpc.n.dwellir.com\",\"grpcEndpoint\":\"https://api-hyperliquid-mainnet-grpc.n.dwellir.com\",\"grpcService\":\"hyperliquid_l1_gateway.v2.HyperliquidL1Gateway\",\"grpcStreamTypes\":[\"FILLS\"],\"weight\":1.0,\"exchangeCode\":\"hyperliquid\",\"subscriptions\":[{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"BTC\"}},{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"ETH\"}},{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"SOL\"}}]}]"
EXCHANGE_WEIGHTS = "{\"hyperliquid\":1.0,\"binance\":0.75,\"binance-us\":0.75,\"cbse\":0.65,\"coinbase\":0.65}"
CLOCK_SYNC_ALPHA = "0.10"
CLOCK_SYNC_MAX_OFFSET_MS = "10000"
NOTIFIER_DEBOUNCE_MS = "60000"
NEWS_FEEDS = "[]"

# Secrets are intentionally excluded from source control/config values.
# Dwellir gRPC is the default ingest path. It fails closed unless the API key
# is provisioned as a Worker secret; the public Hyperliquid WebSocket URL is no
# longer configured as a fallback.
# Provision alerting credentials with:
#   wrangler secret put INGESTOR_CONTROL_TOKEN -c wrangler.ingest.toml
#   wrangler secret put DWELLIR_GRPC_URL -c wrangler.ingest.toml
#   wrangler secret put DWELLIR_API_KEY -c wrangler.ingest.toml  # only if Dwellir supplies a separate API key
#   wrangler secret put DISCORD_WEBHOOK_URL -c wrangler.ingest.toml
#   wrangler secret put TELEGRAM_BOT_TOKEN -c wrangler.ingest.toml
#   wrangler secret put TELEGRAM_CHAT_ID -c wrangler.ingest.toml
#   wrangler secret put ALERT_WEBHOOK_URL -c wrangler.ingest.toml
