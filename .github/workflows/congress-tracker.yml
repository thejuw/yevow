name: Congressional Tracker Runner

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Sovereign-Sigma congress_scrape_runs.run_id
        required: true
      source:
        description: Source to scrape
        required: true
        default: all
        type: choice
        options:
          - all
          - house
          - senate
      trigger_source:
        description: Gateway trigger source
        required: false
        default: manual
      scheduled_for:
        description: Gateway scheduled timestamp
        required: false
      filing_year:
        description: Filing year to scrape
        required: false
        default: "2026"
      max_downloads_per_source:
        description: Max PTR artifacts to download per source
        required: false
        default: "100"
      skip_scrape:
        description: Skip official-source scraping and run post-ingest tasks only
        required: false
        default: "false"
      pnl_refresh_batches:
        description: Number of price-mark refresh batches to run after ingest
        required: false
        default: "0"
      pnl_refresh_limit:
        description: Price-mark refresh rows per batch
        required: false
        default: "250"

permissions:
  contents: read

concurrency:
  group: congress-tracker-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  run:
    name: Scrape, OCR, normalize, and ingest disclosures
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOVEREIGN_API_BASE: https://api.yevow.co
      SOVEREIGN_ADMIN_PASSWORD: ${{ secrets.SOVEREIGN_ADMIN_PASSWORD }}
      CONGRESS_RUN_ID: ${{ inputs.run_id }}
      CONGRESS_FILING_YEAR: ${{ inputs.filing_year || '2026' }}
      CONGRESS_MAX_DAILY_DOWNLOADS: ${{ inputs.max_downloads_per_source || '100' }}
      CONGRESS_PNL_REFRESH_BATCHES: ${{ inputs.pnl_refresh_batches || '0' }}
      CONGRESS_PNL_REFRESH_LIMIT: ${{ inputs.pnl_refresh_limit || '250' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: congress_tracker/requirements.txt

      - name: Install native OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r congress_tracker/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run Congressional Tracker pipeline
        run: >
          python -m congress_tracker.pipeline
          --run-id "${{ inputs.run_id }}"
          --source "${{ inputs.source }}"
          --year "${{ inputs.filing_year || '2026' }}"
          --max-downloads-per-source "${{ inputs.max_downloads_per_source || '100' }}"
          ${{ inputs.skip_scrape == 'true' && '--skip-scrape' || '' }}
          --pnl-refresh-batches "${{ inputs.pnl_refresh_batches || '0' }}"
          --pnl-refresh-limit "${{ inputs.pnl_refresh_limit || '250' }}"
          --download-dir "data/raw_disclosures"

      - name: Upload raw disclosure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: congress-raw-disclosures-${{ inputs.run_id }}
          path: data/raw_disclosures
          if-no-files-found: ignore
          retention-days: 14
