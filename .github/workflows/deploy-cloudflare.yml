name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: all
        type: choice
        options:
          - all
          - workers
          - pages
          - lotto

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_PUBLIC_SOVEREIGN_API_BASE: https://api.yevow.co
      NEXT_PUBLIC_LOTTO_API_BASE: https://lotto-api.yevow.co/api/lotto/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            lotto-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Install Command Center dependencies
        run: npm ci --prefix web

      - name: Install LOTTO Worker dependencies
        run: npm ci --prefix lotto-worker

      - name: Typecheck Workers
        run: npm run typecheck

      - name: Typecheck Command Center
        run: npm run web:typecheck

      - name: Validate isolated LOTTO Worker
        if: ${{ inputs.target == 'all' || inputs.target == 'workers' || inputs.target == 'lotto' }}
        run: npm run check --prefix lotto-worker

      - name: Deploy core Worker
        if: ${{ inputs.target == 'all' || inputs.target == 'workers' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Deploy ingest Worker
        if: ${{ inputs.target == 'all' || inputs.target == 'workers' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.ingest.toml

      - name: Deploy executioner Worker
        if: ${{ inputs.target == 'all' || inputs.target == 'workers' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.executioner.toml

      - name: Apply LOTTO D1 migrations
        if: ${{ inputs.target == 'all' || inputs.target == 'workers' || inputs.target == 'lotto' }}
        working-directory: lotto-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply RABBITHOLE_TX --remote

      - name: Deploy isolated LOTTO Worker
        if: ${{ inputs.target == 'all' || inputs.target == 'workers' || inputs.target == 'lotto' }}
        working-directory: lotto-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --strict

      - name: Build Command Center static export
        if: ${{ inputs.target == 'all' || inputs.target == 'pages' || inputs.target == 'lotto' }}
        run: npm run web:build

      - name: Deploy Command Center Pages
        if: ${{ inputs.target == 'all' || inputs.target == 'pages' || inputs.target == 'lotto' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >
          npx wrangler pages deploy out
          --cwd web
          --branch main
