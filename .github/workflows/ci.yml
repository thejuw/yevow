name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Workers and Command Center
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            lotto-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Install Command Center dependencies
        run: npm ci --prefix web

      - name: Install LOTTO Worker dependencies
        run: npm ci --prefix lotto-worker

      - name: Typecheck Workers
        run: npm run typecheck

      - name: Typecheck Command Center
        run: npm run web:typecheck

      - name: Lint Workers and Command Center
        run: npm run lint

      - name: Whole-codebase ESLint visibility
        run: npm run lint:all:visible
        continue-on-error: true

      - name: Check formatting
        run: npm run format:check

      - name: Engine tests with coverage gate
        run: npm run test:engine

      - name: LOTTO browser-engine tests
        run: npm run test:lotto --prefix web

      - name: Validate isolated LOTTO Worker
        run: npm run check --prefix lotto-worker

      - name: Build Command Center static export
        env:
          NEXT_PUBLIC_SOVEREIGN_API_BASE: https://api.yevow.co
          NEXT_PUBLIC_LOTTO_API_BASE: https://lotto-api.yevow.co/api/lotto/v1
        run: npm run web:build

      - name: Dry-run core Worker deploy
        run: npx wrangler deploy --dry-run

      - name: Dry-run ingest Worker deploy
        run: npx wrangler deploy --config wrangler.ingest.toml --dry-run

      - name: Dry-run executioner Worker deploy
        run: npx wrangler deploy --config wrangler.executioner.toml --dry-run
