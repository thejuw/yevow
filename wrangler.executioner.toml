name = "sovereign-sigma-executioner"
main = "src/ExecutionerWorker.ts"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "TRADING_ENGINE"
class_name = "TradingEngine"
script_name = "sovereign-sigma-core"

[[d1_databases]]
binding = "TRADING_DB"
database_name = "TRADING_DB"
database_id = "64fc2511-fd03-4c76-afd8-2fa671049c10"
preview_database_id = "4c6c2cf3-e6e3-410a-afe1-b4e611a0e34f"

[[kv_namespaces]]
binding = "CONFIG_STORE"
id = "49fe0b24ba1d40209e5d4fa849144dd2"
preview_id = "01652227040f4c59ab9256d0e251ba23"

[[kv_namespaces]]
binding = "RISK_VAULT"
id = "275a00fff7e94e4b9e30e71b24ffb9c5"
preview_id = "3d69fe3608404e049791ce81142dab8e"

[placement]
region = "aws:ap-northeast-1"

[vars]
ENGINE_OBJECT_NAME = "sovereign-sigma:singleton:trading-engine:v3:apac-tokyo"
ENGINE_LOCATION_HINT = "apac"
PLACEMENT_TARGET_COLO = "NRT"
EXCHANGE_ADAPTER = "hyperliquid"
EXCHANGE_BASE_URL = "https://api.hyperliquid.xyz"
HL_INFO_URL = "https://api.hyperliquid.xyz/info"
HL_EXCHANGE_URL = "https://api.hyperliquid.xyz/exchange"
HL_ASSET = "BTC"
HL_DEFAULT_TIF = "Alo"
HL_ORDER_EXPIRES_MS = "10000"
HL_REST_RATE_LIMIT_PER_MINUTE = "1000"
HL_REST_REFILL_PER_SECOND = "18"
HL_IS_MAINNET = "true"
EXCHANGE_ORDER_TEST_MODE = "true"
SHADOW_MODE = "true"
EXCHANGE_RECV_WINDOW_MS = "5000"
SIGNATURE_ALGORITHM = "HYPERLIQUID_EIP712"
SLIPPAGE_GUARD_TICKS = "2"
STRUCTURED_CONSOLE_LOGS = "false"
LOG_SINK_PROVIDER = "disabled"

# Secrets are intentionally excluded from source control/config values.
# Provision them with:
#   wrangler secret put HL_AGENT_ADDRESS -c wrangler.executioner.toml
#   wrangler secret put HL_AGENT_SECRET -c wrangler.executioner.toml
#   wrangler secret put HL_ACCOUNT_ADDRESS -c wrangler.executioner.toml
#   wrangler secret put LOG_SINK_TOKEN -c wrangler.executioner.toml
#
# Keep EXCHANGE_ORDER_TEST_MODE="true" until the Hyperliquid API wallet is
# approved, account reads pass, and signed test payloads have been reviewed.
# Setting it to "false" enables live POST /exchange actions.
