name = "sovereign-sigma-core"
main = "src/index.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "api.yevow.co", custom_domain = true }
]

[[durable_objects.bindings]]
name = "TRADING_ENGINE"
class_name = "TradingEngine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradingEngine"]

[[d1_databases]]
binding = "TRADING_DB"
database_name = "TRADING_DB"
database_id = "64fc2511-fd03-4c76-afd8-2fa671049c10"
preview_database_id = "4c6c2cf3-e6e3-410a-afe1-b4e611a0e34f"
migrations_dir = "."

[[kv_namespaces]]
binding = "CONFIG_STORE"
id = "49fe0b24ba1d40209e5d4fa849144dd2"
preview_id = "01652227040f4c59ab9256d0e251ba23"

[[kv_namespaces]]
binding = "RISK_VAULT"
id = "275a00fff7e94e4b9e30e71b24ffb9c5"
preview_id = "3d69fe3608404e049791ce81142dab8e"

[ai]
binding = "AI"

[[services]]
binding = "EXECUTIONER"
service = "sovereign-sigma-executioner"

[placement]
# Tokyo target: Dwellir advertises Tokyo/Singapore order-book edges for
# Hyperliquid, and the exchange write path is latency-sensitive. Cloudflare
# maps this region hint to the lowest-latency Cloudflare data center near
# AWS Tokyo rather than hard-pinning a specific colo.
region = "aws:ap-northeast-1"

[vars]
ENGINE_OBJECT_NAME = "sovereign-sigma:singleton:trading-engine:v3:apac-tokyo"
ENGINE_LOCATION_HINT = "apac"
PLACEMENT_TARGET_COLO = "NRT"
INGEST_TRANSPORT = "grpc"
DWELLIR_GRPC_ENDPOINT = "https://api-hyperliquid-mainnet-grpc.n.dwellir.com"
DWELLIR_GRPC_STREAMS = "FILLS"
DWELLIR_GRPC_START_LOOKBACK_MS = "1000"
DWELLIR_GRPC_SNAPSHOT_POLL_MS = "1000"
DWELLIR_GRPC_FORWARD_MAX_AGE_MS = "5000"
DWELLIR_GRPC_FATAL_DROP_MS = "200"
DWELLIR_GRPC_FILLS_WATCHDOG_TIMEOUT_MS = "60000"
DWELLIR_GRPC_FATAL_ON_FILLS_ONLY = "false"
DWELLIR_MAX_LATENCY_MS = "2500"
DWELLIR_L4_ORDER_CACHE_LIMIT = "10000"
INGEST_FORWARD_ENCODING = "msgpack"
D1_DIAGNOSTIC_MAX_LATENCY_MS = "250"
DWELLIR_SUBSCRIPTION_TIER = "ENTERPRISE"
DWELLIR_ORDERBOOK_DEPTH = "100"
DWELLIR_ORDERBOOK_TRANSPORT = "websocket"
DWELLIR_ENABLE_L4_BOOK = "true"
RPC_GRPC_ENDPOINT = "https://api-hyperliquid-mainnet-grpc.n.dwellir.com"
RPC_GRPC_SERVICE = "hyperliquid_l1_gateway.v2.HyperliquidL1Gateway"
RPC_GRPC_STREAM_METHOD = "StreamOrderbookSnapshots"
RPC_GRPC_SUBSCRIBE_TYPE = "hyperliquid_l1_gateway.v2.Position"
RPC_GRPC_UPDATE_TYPE = "hyperliquid_l1_gateway.v2.OrderBookSnapshot"
HL_HEARTBEAT_INTERVAL_MS = "15000"
HL_WATCHDOG_TIMEOUT_MS = "5000"
HL_GRPC_BACKOFF_BASE_MS = "50"
HL_MAX_BACKOFF_MS = "30000"
HL_STALE_AFTER_MS = "150"
HL_BOOK_TIMESTAMP_MAX_DRIFT_MS = "100"
HL_SEQUENCE_GAP_MS = "5000"
HL_ASSETS = "BTC,ETH,HYPE,SOL"
MOLTWORKER_HEALTH_URL = "https://api.yevow.co/moltworker/health"
MOLTWORKER_HEARTBEAT_MAX_AGE_MS = "300000"
MARKET_STREAMS = "[{\"id\":\"dwellir-hyperliquid-grpc-fills\",\"source\":\"HYPERLIQUID\",\"source_exchange\":\"hyperliquid\",\"transport\":\"grpc\",\"streamUrl\":\"https://api-hyperliquid-mainnet-grpc.n.dwellir.com\",\"grpcEndpoint\":\"https://api-hyperliquid-mainnet-grpc.n.dwellir.com\",\"grpcService\":\"hyperliquid_l1_gateway.v2.HyperliquidL1Gateway\",\"grpcStreamTypes\":[\"FILLS\"],\"weight\":1.0,\"exchangeCode\":\"hyperliquid\",\"subscriptions\":[{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"BTC\"}},{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"ETH\"}},{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"HYPE\"}},{\"method\":\"subscribe\",\"subscription\":{\"type\":\"trades\",\"coin\":\"SOL\"}}]}]"
EXCHANGE_WEIGHTS = "{\"hyperliquid\":1.0,\"binance\":0.75,\"binance-us\":0.75,\"cbse\":0.65,\"coinbase\":0.65}"
CLOCK_SYNC_ALPHA = "0.10"
CLOCK_SYNC_MAX_OFFSET_MS = "10000"
EXCHANGE_FEE_BPS = "5"
MIN_EV_THRESHOLD = "0"
KELLY_FRACTION = "0.50"
MAX_POSITION_PCT = "0.05"
