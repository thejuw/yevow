FUNDING_INVENTORY_BIAS = "0.25"
ORACLE_GOVERNANCE_MODE = "HYBRID"
ORACLE_MANUAL_SKEPTICISM = "1.40"
ORACLE_MAX_SKEPTICISM = "4.00"
QUOTE_HIBERNATE_MS = "3000"
VAR_CONFIDENCE_Z = "2.326"
AMM_MIN_TICK_CHANGE = "0.00000001"
FUNDING_HORIZON_HOURS = "1"
