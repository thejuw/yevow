name = "sovereign-sigma-core"
main = "src/index.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "api.yevow.co", custom_domain = true }
]

[[durable_objects.bindings]]
name = "TRADING_ENGINE"
class_name = "TradingEngine"

[[durable_objects.bindings]]
name = "DOTCAST_POOL"
class_name = "DotCastPool"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradingEngine"]

[[migrations]]
tag = "v2_dotcast_pool"
new_sqlite_classes = ["DotCastPool"]

[[d1_databases]]
binding = "TRADING_DB"
database_name = "TRADING_DB"
database_id = "64fc2511-fd03-4c76-afd8-2fa671049c10"
preview_database_id = "4c6c2cf3-e6e3-410a-afe1-b4e611a0e34f"
migrations_dir = "migrations"

[[d1_databases]]
binding = "CONGRESS_DB"
database_name = "CONGRESS_DB"
database_id = "b971dedc-7665-4867-a54c-e776945621d3"
migrations_dir = "migrations"

[[d1_databases]]
binding = "EQUITY_DB"
database_name = "EQUITY_DB"
database_id = "417477a0-1188-4b05-8444-aa9fcbb403eb"
migrations_dir = "migrations/equity"

[[r2_buckets]]
binding = "CONGRESS_RAW"
bucket_name = "yevow-congress-raw"

[[kv_namespaces]]
binding = "CONFIG_STORE"
id = "49fe0b24ba1d40209e5d4fa849144dd2"
preview_id = "01652227040f4c59ab9256d0e251ba23"

[[kv_namespaces]]
binding = "RISK_VAULT"
id = "275a00fff7e94e4b9e30e71b24ffb9c5"
preview_id = "3d69fe3608404e049791ce81142dab8e"

[ai]
binding = "AI"

[[services]]
binding = "EXECUTIONER"
service = "sovereign-sigma-executioner"

[placement]
# Tokyo target: Dwellir advertises Tokyo/Singapore order-book edges for
# Hyperliquid, and the exchange write path is latency-sensitive. Cloudflare
# maps this region hint to the lowest-latency Cloudflare data center near
# AWS Tokyo rather than hard-pinning a specific colo.
region = "aws:ap-northeast-1"

[triggers]
# Cloudflare cron is UTC. These two ticks cover US Central midnight across
# daylight/standard time; the Worker still gates execution by local midnight
# and an idempotency key so only one daily Congressional Tracker run is accepted.
crons = ["0 5 * * *", "0 6 * * *"]

