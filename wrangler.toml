name = "sovereign-sigma-core"
main = "src/index.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "api.yevow.co", custom_domain = true }
]

[[durable_objects.bindings]]
name = "TRADING_ENGINE"
class_name = "TradingEngine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradingEngine"]

[[d1_databases]]
binding = "TRADING_DB"
database_name = "TRADING_DB"
database_id = "64fc2511-fd03-4c76-afd8-2fa671049c10"
preview_database_id = "4c6c2cf3-e6e3-410a-afe1-b4e611a0e34f"
migrations_dir = "."

[[kv_namespaces]]
binding = "CONFIG_STORE"
id = "49fe0b24ba1d40209e5d4fa849144dd2"
preview_id = "01652227040f4c59ab9256d0e251ba23"

[[kv_namespaces]]
binding = "RISK_VAULT"
id = "275a00fff7e94e4b9e30e71b24ffb9c5"
preview_id = "3d69fe3608404e049791ce81142dab8e"

[ai]
binding = "AI"

[[services]]
binding = "EXECUTIONER"
service = "sovereign-sigma-executioner"

[placement]
mode = "smart"
# Placement hints are mutually exclusive with Smart Placement.
# If Kaiko or the exchange is single-homed and measured data proves Smart
# Placement is underperforming, replace mode with exactly one of:
#   region = "aws:us-east-1"
#   host = "matching-engine.example.com:443"
#   hostname = "api.exchange.example.com"

[vars]
KAIKO_AUTH_HEADER = "X-Api-Key"
KAIKO_SNAPSHOT_AUTH_HEADER = "X-Api-Key"
KAIKO_HEARTBEAT_INTERVAL_MS = "15000"
KAIKO_STALE_AFTER_MS = "1000"
KAIKO_WATCHDOG_TIMEOUT_MS = "5000"
KAIKO_MAX_BACKOFF_MS = "30000"
MARKET_STREAMS = "[{\"id\":\"binance-us-btc-usdt\",\"source\":\"BINANCE\",\"source_exchange\":\"binance-us\",\"streamUrl\":\"wss://stream.binance.us:9443/ws/btcusdt@depth@100ms\",\"snapshotUrl\":\"https://api.binance.us/api/v3/depth?symbol=BTCUSDT&limit=100\",\"weight\":1.0,\"instrumentCode\":\"btc-usdt\",\"exchangeCode\":\"binance-us\"}]"
EXCHANGE_WEIGHTS = "{\"binance\":1.0,\"binance-us\":1.0,\"cbse\":0.65,\"coinbase\":0.65}"
CLOCK_SYNC_ALPHA = "0.10"
CLOCK_SYNC_MAX_OFFSET_MS = "10000"
EXCHANGE_FEE_BPS = "5"
MIN_EV_THRESHOLD = "0"
KELLY_FRACTION = "0.50"
MAX_POSITION_PCT = "0.05"
MAX_INVENTORY_UNITS = "5"
RISK_AVERSION_FACTOR = "0.01"
ORACLE_GOVERNANCE_MODE = "HYBRID"
ORACLE_MANUAL_SKEPTICISM = "1.40"
ORACLE_MAX_SKEPTICISM = "4.00"
QUOTE_HIBERNATE_MS = "3000"
VAR_CONFIDENCE_Z = "2.326"
AMM_MIN_TICK_CHANGE = "0.00000001"
WHALE_PRINT_Z_THRESHOLD = "5"
JANITOR_INTERVAL_MS = "60000"
ORDER_ACK_TIMEOUT_MS = "2000"
SIGNATURE_ALGORITHM = "HMAC-SHA256"
EXCHANGE_ADAPTER = "binance-us"
EXCHANGE_BASE_URL = "https://api.binance.us"
EXCHANGE_ORDER_TEST_MODE = "true"
EXCHANGE_RECV_WINDOW_MS = "5000"
SLIPPAGE_GUARD_TICKS = "2"
NOTIFIER_DEBOUNCE_MS = "60000"
JANITOR_LOG_RETENTION_DAYS = "30"
NEWS_FEEDS = "[]"
GOLDEN_COLOS = "JFK,EWR,IAD"
HIGH_LATENCY_COLO_RISK_MULTIPLIER = "0.50"
ORDER_BOOK_TICK_SIZE_DEFAULT = "0.00000001"
ORDER_BOOK_TICK_SIZES = "{\"btc-usd\":0.5,\"btc-usdt\":0.01,\"eth-usd\":0.1}"
PROFILER_BUCKET_VOLUME = "10"
PROFILER_ROLLING_WINDOW = "50"
PROFILER_ALERT_THRESHOLD = "0.70"
JITTER_THRESHOLD_MS = "10"
JITTER_SAMPLE_WINDOW = "1000"
JITTER_COMPUTE_INTERVAL_TICKS = "50"
DOM_PRICE_BIN_SIZE_DEFAULT = "10"
DOM_PRICE_BIN_SIZES = "{\"btc-usd\":10,\"btc-usdt\":10,\"eth-usd\":1}"
DOM_SCAN_RANGE_PCT = "0.02"
DOM_WALL_HISTORY_LIMIT = "500"
DOM_SPOOF_PROXIMITY_BPS = "15"
ANOMALY_PRICE_Z_THRESHOLD = "6"
ANOMALY_VOLUME_Z_THRESHOLD = "5"
ANOMALY_CANCEL_EXEC_RATIO_THRESHOLD = "8"
ANOMALY_PRICE_WINDOW_MS = "60000"
ANOMALY_VOLUME_WINDOW_MS = "600000"
ANOMALY_TOP_OF_BOOK_WINDOW_MS = "600000"

# Secrets are intentionally excluded from source control/config values.
# Provision them with:
#   wrangler secret put KAIKO_API_KEY
#   wrangler secret put INGESTOR_CONTROL_TOKEN
#   wrangler secret put JWT_SECRET
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put EXCHANGE_API_KEY
#   wrangler secret put EXCHANGE_API_SECRET
#   wrangler secret put VAULT_ENCRYPTION_SECRET
#   wrangler secret put DISCORD_WEBHOOK_URL
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
#   wrangler secret put ALERT_WEBHOOK_URL
